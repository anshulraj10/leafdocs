{% extends "base.html" %}

{% block title %}{{ title }} — LeafDocs{% endblock %}

{% block head %}
<style>
  .reader-header {
    margin-bottom: 2.25rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .reader-back {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 1rem;
    transition: color 0.15s;
  }
  .reader-back:hover { color: var(--text); text-decoration: none; }

  .reader-title {
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
    margin-bottom: 0.75rem;
  }
  .reader-tags { display: flex; gap: 0.45rem; flex-wrap: wrap; }

  /* Markdown content */
  .prose {
    font-family: var(--font-body);
    font-size: 1.05rem;
    line-height: 1.8;
    color: #d4d4d4;
    max-width: 720px;
  }

  .prose h1, .prose h2, .prose h3,
  .prose h4, .prose h5, .prose h6 {
    font-family: var(--font-ui);
    color: var(--text);
    margin: 2rem 0 0.75rem;
    line-height: 1.3;
  }
  .prose h1 { font-size: 1.6rem; }
  .prose h2 { font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  .prose h3 { font-size: 1.1rem; }

  .prose p { margin: 0 0 1.1rem; }

  .prose a { color: var(--accent); }
  .prose a:hover { text-decoration: underline; }

  .prose ul, .prose ol {
    margin: 0 0 1.1rem 1.5rem;
  }
  .prose li { margin-bottom: 0.3rem; }

  .prose blockquote {
    margin: 1.25rem 0;
    padding: 0.75rem 1.25rem;
    border-left: 3px solid var(--accent);
    background: var(--surface);
    color: var(--muted);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  .prose code {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.1em 0.4em;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: 'Menlo', 'Consolas', monospace;
    color: #c9b4fa;
  }

  .prose pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
    overflow-x: auto;
    margin: 0 0 1.25rem;
  }
  .prose pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.875rem;
    color: #c9b4fa;
  }

  .prose table {
    width: 100%;
    border-collapse: collapse;
    margin: 0 0 1.25rem;
    font-size: 0.92rem;
  }
  .prose th, .prose td {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
  }
  .prose th {
    background: var(--surface);
    font-family: var(--font-ui);
    font-weight: 600;
    color: var(--text);
  }

  .prose hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2rem 0;
  }

  .prose img {
    max-width: 100%;
    border-radius: var(--radius);
    margin: 1rem 0;
  }
</style>
{% endblock %}

{% block content %}
<div class="reader-header">
  <a href="/" class="reader-back">← All documents</a>
  <h1 class="reader-title">{{ title }}</h1>
  {% if tags %}
  <div class="reader-tags">
    {% for tag in tags %}
    <span class="tag">{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}
</div>

<div class="prose">
  {{ content | safe }}
</div>
{% endblock %}
